name: Publish Release
on:
  push:
    branches:
      - main
permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          cache: 'npm'
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
        if: ${{ steps.release.outputs.release_created }}
      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}
      - run: npm run build
        if: ${{ steps.release.outputs.release_created }}
      # --provenance attaches a signed attestation linking the published tarball
      # back to this workflow run and commit, so consumers can verify the package
      # was built from this repo rather than uploaded from a developer machine.
      - run: npm publish --access=public --provenance
        if: ${{ steps.release.outputs.release_created }}
      # - name: Generate SBOM with Trivy
      #   if: ${{ steps.release.outputs.release_created }}
      #   uses: aquasecurity/trivy-action@0.32.0
      #   with:
      #     format: 'cyclonedx'
      #     scan-type: 'fs'
      #     scan-ref: '.'
      #     output: 'bom.json'
      # - name: Upload SBOM as Artifact
      #   if: ${{ steps.release.outputs.release_created }}
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: bom.json
      #     path: bom.json
      #     overwrite: true
      # - name: Upload SBOM to Dependency Track
      #   if: ${{ steps.release.outputs.release_created }}
      #   uses: OctopusDeploy/upload-sbom-go@v1.1.0
      #   with:
      #     dependency-track-url: ${{ secrets.DTRACK_URL }}
      #     dependency-track-key: ${{ secrets.DTRACK_KEY }}
      #     project-name: octopus-mcp-server
      #     project-version: ${{ steps.release.outputs.version }}
      #     parent-name: octopus-mcp-server
      #     is-latest: true
      #     project-tags: octopus-mcp-server
      #     sbom-file: "bom.json"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: ${{ steps.release.outputs.release_created }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        if: ${{ steps.release.outputs.release_created }}
        with:
          username: octopusdeploy
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        if: ${{ steps.release.outputs.release_created }}
        with:
          context: .
          push: true
          tags: octopusdeploy/mcp-server:latest,octopusdeploy/mcp-server:${{ steps.release.outputs.tag_name }}
      # Docker Hub shows the repository overview, not image labels. Push the overview and short
      # description on every push to main; the deprecation notice then appears without waiting for a
      # release. The overview is a separate file because README.md exceeds Docker Hub's 25,000-byte limit.
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: octopusdeploy
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: octopusdeploy/mcp-server
          short-description: "DEPRECATED: use the Remote MCP Server in Octopus Server 2026.3 and later."
          readme-filepath: ./docs/DOCKERHUB.md
